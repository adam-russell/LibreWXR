name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies with native sampler
        env:
          LIBREWXR_REQUIRE_NATIVE: "1"
        run: pip install -e ".[dev,mcp]"
      - name: Run tests
        run: pytest -q
      - name: Check NumPy renderer fallback
        run: |
          LIBREWXR_DISABLE_NATIVE=1 pip install --no-deps -e .
          pytest -q tests/test_sampling.py tests/test_renderer.py
